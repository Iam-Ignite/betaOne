# Render blueprint for the BACKEND (apps/server). In Render: New → Blueprint → pick this repo.
#
# The server is a long-running process (bot + webhooks + trading loops), but Render's
# free tier has no background workers — so it runs as a (free) Web Service that binds
# $PORT and serves /health. Keep it awake with an uptime monitor hitting /health every
# ~10 min (the server also self-pings via RENDER_EXTERNAL_URL as a backup), otherwise
# Render spins it down after 15 min idle and copy-trading stalls.
#
# The frontend (apps/web) deploys separately on Vercel; it calls this service's URL.
services:
  - type: web
    name: copytrade-server
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter server start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Required — fill these in Render Dashboard → Environment.
      - key: MONGODB_URI
        value: ""
        sync: true
      - key: TELEGRAM_BOT_TOKEN
        value: ""
        sync: true
      - key: TELEGRAM_WEBHOOK_SECRET
        value: ""
        sync: true
      - key: WALLET_KEK_BASE64
        value: ""
        sync: true
      # Public URL of THIS service (Telegram + Helius webhooks point here), and the
      # Vercel web origin allowed to call it from the browser (mini app).
      - key: PUBLIC_BASE_URL
        value: ""
        sync: true
      - key: CORS_ORIGIN
        value: ""
        sync: true
      # Admin API auth (API key or basic auth matching web app).
      - key: ADMIN_USER
        value: ""
        sync: true
      - key: ADMIN_PASSWORD
        value: ""
        sync: true
      - key: API_KEY
        value: ""
        sync: true
      # Recommended — admin deposit/error alerts, chain + swap providers.
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: ""
        sync: true
      # Helius
      - key: HELIUS_RPC_URL
        value: ""
        sync: true
      - key: HELIUS_API_KEY
        value: ""
        sync: true
      - key: HELIUS_WEBHOOK_ID
        value: ""
        sync: true
      - key: HELIUS_WEBHOOK_SECRET
        value: ""
        sync: true
      - key: JUPITER_API_KEY
        value: ""
        sync: true
      # EVM
      - key: EVM_RPC_URL
        value: ""
        sync: true
      - key: EVM_USDT_NETWORK
        value: "BNB Smart Chain (BEP-20)"
      - key: EVM_CHAIN_ID
        value: "56"
      - key: EVM_USDT_ADDRESS
        value: "0x55d398326f99059fF775485246999027B3197955"
      - key: EVM_USDT_DECIMALS
        value: "18"
      - key: EVM_EXPLORER_URL
        value: "https://bscscan.com"
      - key: EVM_GAS_SYMBOL
        value: "BNB"
      # Pooled custody / safety defaults.
      - key: OPERATOR_SOL_ADDRESS
        value: ""
        sync: true
      - key: OPERATOR_EVM_ADDRESS
        value: ""
        sync: true
      - key: OPERATOR2_SOL_ADDRESS
        value: ""
        sync: true
      - key: OPERATOR2_EVM_ADDRESS
        value: ""
        sync: true
      - key: OPERATOR2_SHARE
        sync: true
        value: "0"
      - key: SWEEP_DEPOSITS
        sync: true
        value: "true"
      - key: TRADING_ENABLED
        sync: true
        value: "true"
      - key: SIMULATE_TRADING
        sync: true
        value: "true"
      - key: LIVE_TRADING_ALLOWED
        sync: true
        value: "false"
      - key: WORKER_KEEPALIVE_MS
        sync: true
        value: "600000"

